<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>DeepSeek Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
/* 왼쪽: 대화 목록(검색·폴더) | 오른쪽: 채팅. 모드(DeepSeek/PC/Claude)에 따라 강조색이 바뀜 */
:root{
  --bg:#0b0d12; --side:#0f1218; --panel:#141821; --raised:#1b202b; --hover:#212734; --line:#232938; --line2:#30384a;
  --fg:#e8eaf0; --muted:#8b92a5; --faint:#5c6478;
  --ds:#7b93ff; --pc:#f2b450; --cc:#e5845c; --accent:var(--ds); --accent-ink:#0b0d12;
  --danger:#ff6b6b; --ok:#4fd1a5; --warn:#f2b450;
  --sans:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px; --shadow:0 12px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}
.shell[data-mode=pc]{--accent:var(--pc)} .shell[data-mode=cc]{--accent:var(--cc)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.65 var(--sans);-webkit-text-size-adjust:100%;overflow:hidden;letter-spacing:-.005em}
#root{height:100%}
button,input,select,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.muted{color:var(--muted)} .small{font-size:13px} .pad{padding:6px 10px}
svg{flex:none}

/* ── 사이드바 ── */
.shell{height:100%;display:flex}
.side{width:292px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;
  padding:max(14px,env(safe-area-inset-top,0px)) 12px max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px 4px}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--muted);margin-top:-2px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--raised);border:1px solid var(--line2);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:7px 6px}
.logo span{width:4px;border-radius:2px;background:var(--ds)}
.logo span:nth-child(1){height:45%} .logo span:nth-child(2){height:100%;background:var(--pc)} .logo span:nth-child(3){height:70%;background:var(--cc)}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 6px 0 10px;height:38px;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search svg{width:16px;height:16px}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--fg);font-size:14px}
kbd{font:10px var(--mono);color:var(--faint);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;white-space:nowrap}
.folders{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin:0 -2px;padding-inline:2px}
.fchip{flex:none;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font-size:12.5px;cursor:pointer;white-space:nowrap}
.fchip:hover{color:var(--fg);border-color:var(--line2)}
.fchip.on{color:var(--fg);background:var(--raised);border-color:var(--line2)}
.fchip small{color:var(--faint);font-size:11px}
.fchip.add{padding:0 7px} .fchip.add svg{width:14px;height:14px}
.fdot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.list{flex:1;min-height:0;overflow-y:auto;margin:0 -4px;padding:0 4px}
.list section{margin-bottom:6px}
.list h3{margin:10px 8px 4px;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.04em}
.item{position:relative;display:flex;align-items:center;border-radius:9px}
.item:hover,.item.on,.item.menu-open{background:var(--raised)}
.item.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
.item-t{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--fg);padding:7px 4px 7px 12px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.it-title{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;min-width:0}
.it-title .pinmark{width:13px;height:13px;color:var(--accent)}
.item-t small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-t .snip{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--fg);border-radius:3px;padding:0 1px}
.item .more{opacity:0;width:30px;height:30px;margin-right:2px}
.item:hover .more,.item.on .more,.item.menu-open .more{opacity:1}
.rename{flex:1;padding:4px}
.rename input{width:100%;background:var(--bg);border:1px solid var(--accent);border-radius:8px;color:var(--fg);font-size:14px;padding:6px 8px;outline:none}
.menu{position:absolute;right:4px;top:calc(100% - 2px);z-index:25;min-width:210px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:9px;background:none;border:0;color:var(--fg);font-size:13.5px;text-align:left;padding:7px 9px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--hover)}
.menu button svg{width:16px;height:16px;color:var(--muted)}
.menu button.cur{color:var(--accent)} .menu button.cur::after{content:"✓";margin-left:auto}
.menu button.danger,.menu button.danger svg{color:var(--danger)}
.menu-sec{font-size:11px;color:var(--faint);padding:8px 9px 3px}
.menu-sep{height:1px;background:var(--line);margin:5px 4px}
.side-foot{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.syncbar{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--muted);font:12px var(--sans);padding:6px 4px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.syncbar:hover{color:var(--fg)}
.scrim{display:none}

/* ── 공통 버튼 ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);font:500 14px var(--sans);padding:9px 12px;border-radius:10px;cursor:pointer}
.btn:hover{background:var(--raised)}
.btn svg{width:18px;height:18px}
.btn.wide{width:100%}
.btn.primary{background:var(--fg);color:var(--bg);border-color:transparent;font-weight:600}
.btn.primary:hover{background:#fff}
.btn.ghost{background:none;border-style:dashed;color:var(--muted)}
.btn.sm{padding:6px 10px;font-size:13px} .btn.sm svg{width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.icon{position:relative;flex:none;width:38px;height:38px;border-radius:10px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.icon:hover{color:var(--fg);background:var(--hover)}
.icon:disabled{opacity:.35;cursor:default}
.icon svg{width:20px;height:20px}
.icon.sm{width:32px;height:32px} .icon.sm svg{width:17px;height:17px}
.icon.xs{width:24px;height:24px} .icon.xs svg{width:14px;height:14px}
.icon.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.icon em{position:absolute;top:3px;right:2px;font:600 10px/15px var(--sans);font-style:normal;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:var(--accent-ink)}

/* ── 채팅 영역 ── */
.app{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:6px;min-height:56px;
  padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px 20px}
.hd-title{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.hd-title b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-folder{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.hd-r{display:flex;align-items:center;gap:2px}
.tok{font:500 11.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;margin-right:4px;white-space:nowrap}
.tok.hi{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.wschip{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:none;color:var(--muted);font:12px var(--mono);border-radius:999px;padding:3px 9px;cursor:pointer;margin-right:4px}
.wschip svg{width:14px;height:14px;color:var(--accent)}

main{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:22px;
  padding:10px max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px))}
main>*{width:100%;max-width:780px;margin-inline:auto}
.hero{margin:auto;text-align:center;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px 8px}
.hero h2{margin:8px 0 0;font-size:24px;font-weight:700;letter-spacing:-.03em}
.hero p{margin:0;font-size:14.5px;max-width:460px}
.hero-badge{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
.hero-badge svg{width:26px;height:26px}
.examples{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.examples button{background:var(--panel);border:1px solid var(--line);color:var(--fg);font-size:13.5px;border-radius:999px;padding:8px 14px;cursor:pointer}
.examples button:hover{border-color:var(--accent)}
.msg{display:flex;flex-direction:column;gap:8px;min-width:0}
.msg.user{align-items:flex-end}
.bubble{max-width:82%;padding:10px 15px;border-radius:18px;border-bottom-right-radius:6px;background:var(--raised);border:1px solid var(--line2);white-space:pre-wrap;overflow-wrap:anywhere}
.imgs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.imgs img{width:104px;height:104px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.status{font-size:12.5px;color:var(--muted)}
.via{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;font-size:12px;font-weight:500;padding:3px 10px 3px 8px;border-radius:999px}
.via svg{width:14px;height:14px}
.via.pc{color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,transparent)}
.via.cc{color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,transparent)}
.refs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--faint)}
.ref{display:inline-flex;align-items:center;gap:5px;max-width:240px;background:none;border:1px solid var(--line);color:var(--muted);font-size:12px;border-radius:999px;padding:2px 9px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref svg{width:12px;height:12px}
.ref:hover{color:var(--fg);border-color:var(--accent)}
.ref.auto{border-style:dashed}
.sumnote{font-size:12px;color:var(--muted);border:1px dashed var(--line2);border-radius:10px;padding:6px 10px;text-align:center}
.sources{margin:2px 0 0;padding-left:22px;font-size:13px;color:var(--muted)}
.sources a{color:var(--accent);word-break:break-all}
.md{overflow-wrap:anywhere;min-width:0}
.md p{margin:.55em 0}.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{letter-spacing:-.02em;line-height:1.35;margin:1em 0 .4em}
.md h1{font-size:1.35em}.md h2{font-size:1.2em}.md h3{font-size:1.05em}
.md pre{background:#07090d;border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto;font:13px/1.55 var(--mono)}
.md code{font-family:var(--mono);font-size:.88em}
.md :not(pre)>code{background:var(--raised);padding:1px 6px;border-radius:6px}
.md table{border-collapse:collapse;display:block;overflow-x:auto;font-size:14px}
.md th,.md td{border:1px solid var(--line);padding:6px 10px}
.md th{background:var(--panel)}
.md a{color:var(--accent)}
.md img{max-width:100%}
.md blockquote{margin:.5em 0;padding-left:12px;border-left:3px solid var(--line2);color:var(--muted)}
.md ul,.md ol{padding-left:1.4em}
details.think{border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--muted);font-size:13px}
details.think summary{cursor:pointer}
details.think div{white-space:pre-wrap;margin-top:6px;max-height:40vh;overflow:auto}
.cursor .md>:last-child::after,.cursor .md:empty::after{content:"▍";color:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.err{color:var(--danger);font-size:13px;background:color-mix(in srgb,var(--danger) 8%,transparent);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);border-radius:10px;padding:9px 12px}

/* ── 입력창 ── */
footer{padding:4px max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
footer>*{max-width:800px;margin-inline:auto}
.composer{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:8px 8px 6px;box-shadow:0 6px 30px rgba(0,0,0,.25);transition:border-color .15s}
.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 65%,var(--line2))}
.composer.drag{border-color:var(--accent);border-style:dashed}
.ctop{display:flex;flex-wrap:wrap;gap:6px;padding:2px 4px 6px;align-items:center}
.lchip{display:inline-flex;align-items:center;gap:4px;max-width:260px;background:var(--raised);border:1px solid var(--line2);border-radius:999px;padding:0 4px 0 9px;height:28px;font-size:12.5px;color:var(--fg)}
.lchip svg{width:13px;height:13px;color:var(--accent)}
.lchip .lname{background:none;border:0;color:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding:0 2px}
.lchip .lx{background:none;border:0;color:var(--muted);width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1}
.lchip .lx:hover{background:var(--hover);color:var(--fg)}
.thumb{position:relative;flex:none}
.thumb img{width:58px;height:58px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.thumb button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);background:var(--raised);color:var(--fg);font-size:13px;line-height:1;cursor:pointer;padding:0}
.composer textarea{width:100%;background:none;border:0;color:var(--fg);font:16px/1.55 var(--sans);resize:none;outline:none;max-height:200px;padding:6px 8px}
.composer textarea::placeholder{color:var(--faint)}
.ctools{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cl,.cr{display:flex;align-items:center;gap:2px}
.cr{gap:8px}
.cl .icon{width:36px;height:36px}
.modes{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.mode{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:0;border-radius:999px;background:none;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.mode svg{width:15px;height:15px}
.mode:hover:not(:disabled){color:var(--fg)}
.mode:disabled{cursor:default}
.mode.on{color:var(--accent-ink);font-weight:600}
.mode.on.m-ds{background:var(--ds)} .mode.on.m-pc{background:var(--pc)} .mode.on.m-cc{background:var(--cc)}
.send{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;transition:transform .1s}
.send svg{width:19px;height:19px;stroke-width:2.4}
.send:active{transform:scale(.94)}
.send:disabled{background:var(--raised);color:var(--faint);cursor:default}
.send.stop{background:var(--fg);color:var(--bg)}
.send.stop svg{fill:currentColor}

/* ── 겹창 ── */
.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding:max(12px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(18px,env(safe-area-inset-left,0px))}
.ov-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:8px}
.ov-title{display:flex;flex-direction:column;min-width:0}
.ov-title b{font-size:17px}
.ov-title .muted{font-size:12.5px}
.ov-tools{display:flex;align-items:center;gap:6px}
.mini-search{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:36px;color:var(--muted)}
.mini-search:focus-within{border-color:var(--accent)}
.mini-search svg{width:15px;height:15px}
.mini-search input{background:none;border:0;outline:none;color:var(--fg);font-size:14px;width:160px;min-width:0}
.mini-search.wide input{width:100%;flex:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);padding:2px 2px 8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.legend i.ln{width:18px;height:3px;border-radius:2px;background:var(--accent)}
.graph{flex:1;width:100%;min-height:0;touch-action:none}
.g-link{stroke:var(--line2);transition:opacity .15s}
.g-link.manual{stroke:var(--accent);stroke-dasharray:none}
.g-node circle{fill:color-mix(in srgb,var(--c) 22%,var(--panel));stroke:var(--c);stroke-width:1.6;transition:opacity .15s}
.g-node:hover circle{fill:color-mix(in srgb,var(--c) 45%,var(--panel))}
.g-node.cur circle{fill:var(--c);stroke:var(--fg);stroke-width:2.5}
.g-node text{text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3.5px}
.g-node .t1{fill:var(--fg);font-size:12px;font-weight:500}
.g-node .t2{fill:var(--muted);font-size:10px;font-family:var(--mono)}
.g-node.dim,.g-link.dim,.g-node.miss,.g-link.miss{opacity:.15}
.g-node.hit circle{stroke:var(--fg);stroke-width:3}

.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(3,4,8,.62);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px}
.sheet{width:100%;max-width:460px;max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.sheet .ov-head b{font-size:16px}
.lbl{font-size:12px;color:var(--muted);margin-top:8px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:15px var(--mono);padding:9px 10px;outline:none;resize:vertical}
select.inp{font-family:var(--sans);font-size:14px;appearance:auto}
textarea.inp{font-family:var(--sans)}
.inp:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:6px}

.help{margin:2px 0 0;font-size:12px;color:var(--muted)}

.help b{color:var(--fg);font-weight:500}
.help.warn{color:var(--warn)}
.sec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;font-weight:700}
.syncrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.syncrow .small{flex:1;min-width:0}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line2)}
.sdot.ok{background:var(--ok)} .sdot.busy{background:var(--accent)} .sdot.err{background:var(--danger)} .sdot.off{background:var(--line2)}
.pick-list{display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow:auto;margin:6px -4px;padding:0 4px}
.pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer}
.pick:hover{background:var(--raised)}
.pick.on{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.pick input{width:17px;height:17px;accent-color:var(--accent);flex:none}
.pick span{display:flex;flex-direction:column;min-width:0}
.pick b{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick small{color:var(--muted);font-size:11.5px}
.qr{display:block;width:min(280px,100%);height:auto;margin:6px auto;border-radius:12px;image-rendering:pixelated;background:#fff}

/* ── 작업 공간 · 도구 ── */
.ws{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.ws-h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.ws-h svg{width:15px;height:15px;color:var(--accent)}
.ws-info{display:flex;flex-direction:column;min-width:0;background:var(--raised);border-radius:9px;padding:7px 10px}
.ws-info b{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-info small{color:var(--muted);font-size:11px}
.ws-status{color:var(--accent);margin:0}
.ws-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ws-btns .btn{flex:1}
.ws-btns .icon.sm{width:32px;height:32px}
.ws .help{margin:0}
.ws>.muted.small{margin:0;font-size:12px}
.app.dragging main{outline:2px dashed var(--accent);outline-offset:-10px;border-radius:14px}
.tool{border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:13px;overflow:hidden}
.tool details>summary{display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;list-style:none;min-width:0}
.tool details>summary::-webkit-details-marker{display:none}
.tool summary b{font-weight:600;white-space:nowrap}
.tool summary code{font:12px var(--mono);color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .tstat{font-size:12px;color:var(--muted);white-space:nowrap}
.tool.err .tstat{color:var(--danger)}
.tdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)}
.tool.run .tdot{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.tool.err .tdot{background:var(--danger)}
@keyframes pulse{50%{opacity:.35}}
.tres,.diff{margin:0;border-top:1px solid var(--line);padding:9px 11px;font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;color:var(--fg);background:var(--bg)}
.diff .add{color:var(--ok)} .diff .del{color:var(--danger)} .diff .hd{color:var(--muted)}
.timgs{display:flex;flex-wrap:wrap;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.timgs img{max-width:100%;max-height:420px;border-radius:8px;background:#fff}
.tact{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.approvals{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.appr{border:1px solid var(--pc);background:color-mix(in srgb,var(--pc) 9%,var(--panel));border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.appr-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.appr-t b{font-size:13px;font-weight:600}
.appr-t code{font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:120px;overflow:auto;background:var(--bg);border-radius:8px;padding:6px 8px}
.appr-btns{display:flex;flex-wrap:wrap;gap:6px}

/* ── 추가 기능 ── */
.tools-row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tools-row button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:1px solid transparent;border-radius:10px;color:var(--muted);font-size:11px;padding:6px 2px;cursor:pointer}
.tools-row button:hover{background:var(--raised);color:var(--fg)}
.tools-row svg{width:18px;height:18px}
.tools-row small{position:absolute;top:2px;right:8px;font-size:9.5px;color:var(--accent)}
.hm-wrap{position:relative}
.hmenu{right:0;left:auto;top:calc(100% + 4px);min-width:230px}
.menu button:disabled{opacity:.4;cursor:default}
.pchip{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font-size:12.5px;cursor:pointer;margin-right:4px;max-width:180px}
.pchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip svg{width:15px;height:15px}
.pchip:hover{color:var(--fg);border-color:var(--line2)}
.pchip.on{color:var(--fg);border-color:color-mix(in srgb,var(--accent) 50%,var(--line));background:color-mix(in srgb,var(--accent) 10%,transparent)}
.via.ps{color:#c9a7ff;background:color-mix(in srgb,#c9a7ff 12%,transparent)}
.kbrefs{display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--ok) 7%,transparent);border:1px solid color-mix(in srgb,var(--ok) 25%,var(--line));border-radius:10px;padding:5px 10px}
.kbrefs svg{width:14px;height:14px;color:var(--ok);margin-top:2px}
.mact{display:flex;align-items:center;gap:2px;opacity:.55;transition:opacity .15s;min-height:24px}
.msg:hover .mact,.mact:focus-within{opacity:1}
.mact .icon.xs{width:28px;height:28px} .mact .icon.xs svg{width:15px;height:15px}
.mact.u{justify-content:flex-end}
.vnav{display:flex;align-items:center;gap:0;margin-right:6px;font:12px var(--mono);color:var(--muted)}
.memnote{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-left:6px}
.memnote svg{width:13px;height:13px;color:var(--accent)}
.uedit{width:min(600px,92%);display:flex;flex-direction:column;gap:6px}
.uedit textarea{font-family:var(--sans);font-size:15px}
.row-btns{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.btn.primary.sm{padding:6px 12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp-col{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--panel);min-width:0;display:flex;flex-direction:column;gap:8px}
.via.ds{color:var(--ds);background:color-mix(in srgb,var(--ds) 12%,transparent)}
.md pre{position:relative;padding-top:34px}
.codebar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:4px;padding:4px 6px 4px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 60%,#07090d);border-radius:12px 12px 0 0;font-family:var(--sans)}
.codebar span{flex:1;font:11px var(--mono);color:var(--faint)}
.codebar button{background:none;border:0;color:var(--muted);font:12px var(--sans);padding:3px 8px;border-radius:6px;cursor:pointer}
.codebar button:hover{background:var(--hover);color:var(--fg)}
.composer{position:relative}
.slash{position:absolute;left:8px;right:8px;bottom:calc(100% + 6px);z-index:12;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;max-height:320px;overflow:auto}
.slash button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:none;border:0;color:var(--fg);text-align:left;padding:7px 10px;border-radius:9px;cursor:pointer}
.slash button.on,.slash button:hover{background:var(--hover)}
.slash b{font:500 13px var(--mono);color:var(--accent)}
.slash small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slash .manage{flex-direction:row;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);border-radius:0;margin-top:4px;padding-top:9px}
.slash .manage svg{width:14px;height:14px}
.listening{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--danger);padding:2px 8px}
.listening i{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
.icon.rec{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}
.sheet.wide{max-width:640px}
.addrow{display:flex;gap:6px;align-items:center;margin-top:6px}
.addrow .inp{flex:1;font-family:var(--sans);font-size:14px}
.memlist{display:flex;flex-direction:column;gap:4px;max-height:44vh;overflow:auto;margin:8px -4px;padding:0 4px}
.mem{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 6px 7px 11px;font-size:14px}
.mem>span{flex:1;min-width:0;cursor:text}
.mem.lib>span{display:flex;flex-direction:column;cursor:pointer}
.mem.lib b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem.lib small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem .addrow{flex:1;margin:0}
.editbox{display:flex;flex-direction:column;gap:4px}
.editbox .inp{font-family:var(--sans);font-size:14px}
.kbstat{font:12px var(--mono);color:var(--muted);margin-top:8px}
.kbhit{border:1px solid var(--line);border-radius:10px;margin-top:6px;font-size:13px}
.kbhit summary{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;cursor:pointer}
.kbhit summary b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbhit summary small{color:var(--muted);white-space:nowrap}
.kbhit pre{margin:0;border-top:1px solid var(--line);padding:9px 10px;white-space:pre-wrap;font:12px/1.5 var(--mono);max-height:240px;overflow:auto;background:var(--bg)}
.g-link.seq{stroke:color-mix(in srgb,var(--fg) 25%,transparent)}
.g-node.kb .t1{font-size:10px}
.g-node.sel circle{stroke:var(--fg);stroke-width:3}
.kbcard{position:absolute;right:16px;bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 32px));max-height:55vh;display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.kbcard pre{margin:0;white-space:pre-wrap;font:12.5px/1.55 var(--mono);overflow:auto;min-height:0;flex:1;background:var(--bg);border-radius:10px;padding:9px 10px}
.kbcard .ov-head{padding:0}
.kbcard .ov-head b{font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.stats small{color:var(--muted);font-size:12px}
.stats b{font:600 22px var(--mono);letter-spacing:-.02em}
.stats em{font-style:normal;color:var(--muted);font-size:11.5px}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding:6px 0 18px;border-bottom:1px solid var(--line);margin-bottom:8px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.bar i{display:block;width:100%;min-height:2px;border-radius:4px 4px 0 0;background:var(--accent)}
.bar small{position:absolute;bottom:-17px;font:10px var(--mono);color:var(--faint)}
.runframe{width:100%;height:min(60vh,520px);border:1px solid var(--line);border-radius:12px;background:#fff}
.runout{max-height:50vh;border:1px solid var(--line);border-radius:10px}
.runimg{max-width:100%;border-radius:10px;background:#fff}
/* 캔버스 */
.canvas{width:min(42vw,640px);flex:none;height:100%;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--side);
  padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) 12px;gap:8px}
.cv-head{display:flex;align-items:center;gap:4px}

.cv-title:focus{border-color:var(--line2)}
.cv-lang{font:11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:4px}
.cv-text{flex:1;min-height:0;width:100%;resize:none;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--fg);font:15px/1.7 var(--sans);padding:14px 16px;outline:none}

  .drawer-open .side{transform:none}

}

}

}
@media (prefers-reduced-motion:reduce){.side{transition:none}.cursor .md>:last-child::after,.cursor .md:empty::after,.tool.run .tdot{animation:none}}
