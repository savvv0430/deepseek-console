<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 보안: 정해 둔 곳(모델 API·검색·GitHub 동기화·CDN·내 PC 연결 프로그램) 말고는 데이터를 못 보냄.
     답에 섞인 외부 그림 주소로 몰래 내용이 새는 것도 막음(img-src). 새 서비스를 붙이면 connect-src 에 추가해야 함 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https://nokeep.ai https://api.deepseek.com https://s.jina.ai https://api.github.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com http://127.0.0.1:* http://localhost:* https://*.ts.net; frame-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>DeepSeek Console</title>
<script>
/* 테마: 자동이면 시간에 따라 낮엔 아이보리, 밤엔 다크. 화면을 그리기 전에 적용해서 깜빡임이 없음
   localStorage dsc.theme = auto|light|dark, dsc.themeFrom/dsc.themeTo = 아이보리 시작·끝 시각(0~23) */
(function () {
  function get(k, d) { try { var v = localStorage.getItem(k); return v == null || v === "" ? d : v; } catch (e) { return d; } }
  function hours() { var f = parseInt(get("dsc.themeFrom", "7"), 10), t = parseInt(get("dsc.themeTo", "19"), 10); return [f >= 0 && f < 24 ? f : 7, t >= 0 && t < 24 ? t : 19]; }
  function isDay(h, f, t) { return f <= t ? h >= f && h < t : h >= f || h < t; }
  function pick(now) {
    var m = get("dsc.theme", "auto");
    if (m === "light" || m === "dark") return m;
    var ft = hours(); return isDay((now || new Date()).getHours(), ft[0], ft[1]) ? "light" : "dark";
  }
  function apply(anim) {
    var r = document.documentElement, t = pick();
    if (r.getAttribute("data-theme") === t) return t;
    if (anim && r.hasAttribute("data-theme")) {
      r.classList.add("theme-anim"); clearTimeout(apply.tm);
      apply.tm = setTimeout(function () { r.classList.remove("theme-anim"); }, 800);
    }
    r.setAttribute("data-theme", t);
    var mc = document.querySelector('meta[name="theme-color"]');
    if (mc) mc.setAttribute("content", t === "light" ? "#faf6ee" : "#0b0d12");
    try { window.dispatchEvent(new CustomEvent("dsc-theme", { detail: t })); } catch (e) {}
    return t;
  }
  window.dscTheme = { pick: pick, apply: apply, hours: hours, isDay: isDay };
  apply(false);
  setInterval(function () { apply(true); }, 30000);          // 정해진 시각이 되면 열려 있어도 바뀜
  document.addEventListener("visibilitychange", function () { if (!document.hidden) apply(true); });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 왼쪽: 대화 목록(검색·폴더) | 오른쪽: 채팅. 모드(DeepSeek/PC/Claude)에 따라 강조색이 바뀜
   테마: html[data-theme=dark|light] — 색은 전부 아래 변수로만 씀(글자 색 포함) */
:root,[data-theme=dark]{
  --bg:#0b0d12; --side:#0f1218; --panel:#141821; --raised:#1b202b; --hover:#212734; --line:#232938; --line2:#30384a;
  --fg:#e8eaf0; --muted:#8b92a5; --faint:#5c6478;
  --ds:#7b93ff; --pc:#f2b450; --cc:#e5845c; --ps:#c9a7ff; --accent:var(--ds); --accent-ink:#0b0d12;
  --danger:#ff6b6b; --ok:#4fd1a5; --warn:#f2b450;
  --code-bg:#07090d; --scrim:rgba(3,4,8,.62); --primary-hover:#fff;
  --hl-kw:#ff7b72; --hl-str:#a5d6ff; --hl-num:#79c0ff; --hl-fn:#d2a8ff; --hl-var:#ffa657; --hl-cmt:#8b949e;
  --sans:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Pretendard Variable",Pretendard,monospace;   /* 코드 속 한글은 Pretendard 로 */
  --r:12px; --shadow:0 12px 40px rgba(0,0,0,.45); --shadow-sm:0 6px 30px rgba(0,0,0,.25);
  color-scheme:dark;
}
/* 아이보리: 따뜻한 종이색 바탕 + 진한 먹색 글자. 강조색은 밝은 바탕에서 읽히도록 진하게 */
[data-theme=light]{
  --bg:#faf6ee; --side:#f3eee3; --panel:#fffdf8; --raised:#efe8da; --hover:#e9e1d1; --line:#e4dbc9; --line2:#d5c9b3;
  --fg:#2a251e; --muted:#6e6558; --faint:#958b7c;
  --ds:#3d5ad6; --pc:#9a5f08; --cc:#ad4b24; --ps:#7a4fd0; --accent-ink:#fffdf8;
  --danger:#c2362f; --ok:#1b7a55; --warn:#9a5f08;
  --code-bg:#f3ede2; --scrim:rgba(43,37,30,.3); --primary-hover:#000;
  --hl-kw:#cf222e; --hl-str:#0a3069; --hl-num:#0550ae; --hl-fn:#8250df; --hl-var:#953800; --hl-cmt:#6e7781;
  --shadow:0 12px 36px rgba(84,64,32,.14); --shadow-sm:0 4px 18px rgba(84,64,32,.08);
  color-scheme:light;
}
/* 테마가 바뀌는 순간만 부드럽게 (평소 hover 등에는 영향 없음) */
.theme-anim,.theme-anim *,.theme-anim *::before,.theme-anim *::after{transition:background-color .6s ease,color .6s ease,border-color .6s ease,fill .6s ease,stroke .6s ease,box-shadow .6s ease!important}
@media (prefers-reduced-motion:reduce){.theme-anim,.theme-anim *{transition:none!important}}
.shell[data-mode=pc]{--accent:var(--pc)} .shell[data-mode=cc]{--accent:var(--cc)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.65 var(--sans);-webkit-text-size-adjust:100%;overflow:hidden;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* 코드 색 (highlight.js) — 테마 변수로 */
.hljs{color:var(--fg);background:none}
.hljs-comment,.hljs-quote{color:var(--hl-cmt)}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-type,.hljs-doctag,.hljs-meta .hljs-keyword,.hljs-template-tag{color:var(--hl-kw)}
.hljs-string,.hljs-regexp,.hljs-addition,.hljs-meta .hljs-string{color:var(--hl-str)}
.hljs-number,.hljs-symbol,.hljs-bullet,.hljs-attr,.hljs-attribute,.hljs-selector-attr,.hljs-selector-class,.hljs-selector-id,.hljs-meta,.hljs-variable.constant_{color:var(--hl-num)}
.hljs-title,.hljs-title.function_,.hljs-title.class_,.hljs-section,.hljs-name,.hljs-built_in{color:var(--hl-fn)}
.hljs-variable,.hljs-template-variable,.hljs-params,.hljs-property,.hljs-subst{color:var(--hl-var)}
.hljs-deletion{color:var(--danger)} .hljs-emphasis{font-style:italic} .hljs-strong{font-weight:600} .hljs-link{text-decoration:underline}
.num{font-variant-numeric:tabular-nums}
#root{height:100%}
button,input,select,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.muted{color:var(--muted)} .small{font-size:13px} .pad{padding:6px 10px}
svg{flex:none}

/* ── 사이드바 ── */
.shell{height:100%;display:flex}
.side{width:292px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;
  padding:max(14px,env(safe-area-inset-top,0px)) 12px max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px 4px}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--muted);margin-top:-2px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--raised);border:1px solid var(--line2);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:7px 6px}
.logo span{width:4px;border-radius:2px;background:var(--ds)}
.logo span:nth-child(1){height:45%} .logo span:nth-child(2){height:100%;background:var(--pc)} .logo span:nth-child(3){height:70%;background:var(--cc)}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 6px 0 10px;height:38px;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search svg{width:16px;height:16px}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--fg);font-size:14px}
kbd{font:10px var(--mono);color:var(--faint);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;white-space:nowrap}
.folders{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin:0 -2px;padding-inline:2px}
.fchip{flex:none;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font-size:12.5px;cursor:pointer;white-space:nowrap}
.fchip:hover{color:var(--fg);border-color:var(--line2)}
.fchip.on{color:var(--fg);background:var(--raised);border-color:var(--line2)}
.fchip small{color:var(--faint);font-size:11px}
.fchip.add{padding:0 7px} .fchip.add svg{width:14px;height:14px}
.fdot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.list{flex:1;min-height:0;overflow-y:auto;margin:0 -4px;padding:0 4px}
.list section{margin-bottom:6px}
.list h3{margin:10px 8px 4px;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.04em}
.item{position:relative;display:flex;align-items:center;border-radius:9px}
.item:hover,.item.on,.item.menu-open{background:var(--raised)}
.item.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
.item-t{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--fg);padding:7px 4px 7px 12px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.it-title{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;min-width:0}
.it-title .pinmark{width:13px;height:13px;color:var(--accent)}
.item-t small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-t .snip{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--fg);border-radius:3px;padding:0 1px}
.item .more{opacity:0;width:30px;height:30px;margin-right:2px}
.item:hover .more,.item.on .more,.item.menu-open .more{opacity:1}
.rename{flex:1;padding:4px}
.rename input{width:100%;background:var(--bg);border:1px solid var(--accent);border-radius:8px;color:var(--fg);font-size:14px;padding:6px 8px;outline:none}
.menu{position:absolute;right:4px;top:calc(100% - 2px);z-index:25;min-width:210px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:9px;background:none;border:0;color:var(--fg);font-size:13.5px;text-align:left;padding:7px 9px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--hover)}
.menu button svg{width:16px;height:16px;color:var(--muted)}
.menu button.cur{color:var(--accent)} .menu button.cur::after{content:"✓";margin-left:auto}
.menu button.danger,.menu button.danger svg{color:var(--danger)}
.menu-sec{font-size:11px;color:var(--faint);padding:8px 9px 3px}
.menu-sep{height:1px;background:var(--line);margin:5px 4px}
.side-foot{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.syncbar{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--muted);font:12px var(--sans);padding:6px 4px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.syncbar:hover{color:var(--fg)}
.scrim{display:none}

/* ── 공통 버튼 ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);font:500 14px var(--sans);padding:9px 12px;border-radius:10px;cursor:pointer}
.btn:hover{background:var(--raised)}
.btn svg{width:18px;height:18px}
.btn.wide{width:100%}
.btn.primary{background:var(--fg);color:var(--bg);border-color:transparent;font-weight:600}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ghost{background:none;border-style:dashed;color:var(--muted)}
.btn.sm{padding:6px 10px;font-size:13px} .btn.sm svg{width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.icon{position:relative;flex:none;width:38px;height:38px;border-radius:10px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.icon:hover{color:var(--fg);background:var(--hover)}
.icon:disabled{opacity:.35;cursor:default}
.icon svg{width:20px;height:20px}
.icon.sm{width:32px;height:32px} .icon.sm svg{width:17px;height:17px}
.icon.xs{width:24px;height:24px} .icon.xs svg{width:14px;height:14px}
.icon.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.icon em{position:absolute;top:3px;right:2px;font:600 10px/15px var(--sans);font-style:normal;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:var(--accent-ink)}

/* ── 채팅 영역 ── */
.app{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:6px;min-height:56px;
  padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px 20px}
.hd-title{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.hd-title b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-folder{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.hd-r{display:flex;align-items:center;gap:2px}
.tok{font:500 12px var(--sans);font-variant-numeric:tabular-nums;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;margin-right:4px;white-space:nowrap}
.tok.hi{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.wschip{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:none;color:var(--muted);font:12.5px var(--sans);border-radius:999px;padding:3px 9px;cursor:pointer;margin-right:4px}
.wschip svg{width:14px;height:14px;color:var(--accent)}

main{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:22px;
  padding:10px max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px))}
main>*{width:100%;max-width:780px;margin-inline:auto}
.hero{margin:auto;text-align:center;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px 8px}
.hero h2{margin:8px 0 0;font-size:24px;font-weight:700;letter-spacing:-.03em}
.hero p{margin:0;font-size:14.5px;max-width:460px}
.hero-badge{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
.hero-badge svg{width:26px;height:26px}
.examples{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.examples button{background:var(--panel);border:1px solid var(--line);color:var(--fg);font-size:13.5px;border-radius:999px;padding:8px 14px;cursor:pointer}
.examples button:hover{border-color:var(--accent)}
.msg{display:flex;flex-direction:column;gap:8px;min-width:0}
.msg.user{align-items:flex-end}
.bubble{max-width:82%;padding:10px 15px;border-radius:18px;border-bottom-right-radius:6px;background:var(--raised);border:1px solid var(--line2);white-space:pre-wrap;overflow-wrap:anywhere}
.imgs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.imgs img{width:104px;height:104px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.status{font-size:12.5px;color:var(--muted)}
.via{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;font-size:12px;font-weight:500;padding:3px 10px 3px 8px;border-radius:999px}
.via svg{width:14px;height:14px}
.via.pc{color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,transparent)}
.via.cc{color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,transparent)}
.refs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--faint)}
.ref{display:inline-flex;align-items:center;gap:5px;max-width:240px;background:none;border:1px solid var(--line);color:var(--muted);font-size:12px;border-radius:999px;padding:2px 9px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref svg{width:12px;height:12px}
.ref:hover{color:var(--fg);border-color:var(--accent)}
.ref.auto{border-style:dashed}
.sumnote{font-size:12px;color:var(--muted);border:1px dashed var(--line2);border-radius:10px;padding:6px 10px;text-align:center}
.sources{margin:2px 0 0;padding-left:22px;font-size:13px;color:var(--muted)}
.sources a{color:var(--accent);word-break:break-all}
.md{overflow-wrap:anywhere;min-width:0}
.md p{margin:.55em 0}.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{letter-spacing:-.02em;line-height:1.35;margin:1em 0 .4em}
.md h1{font-size:1.35em}.md h2{font-size:1.2em}.md h3{font-size:1.05em}
.md pre{background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto;font:13px/1.55 var(--mono)}
.md code{font-family:var(--mono);font-size:.88em}
.md :not(pre)>code{background:var(--raised);padding:1px 6px;border-radius:6px}
.md table{border-collapse:collapse;display:block;overflow-x:auto;font-size:14px}
.md th,.md td{border:1px solid var(--line);padding:6px 10px}
.md th{background:var(--panel)}
.md a{color:var(--accent)}
.md img{max-width:100%}
.md blockquote{margin:.5em 0;padding-left:12px;border-left:3px solid var(--line2);color:var(--muted)}
.md ul,.md ol{padding-left:1.4em}
details.think{border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--muted);font-size:13px}
details.think summary{cursor:pointer}
details.think div{white-space:pre-wrap;margin-top:6px;max-height:40vh;overflow:auto}
.cursor .md>:last-child::after,.cursor .md:empty::after{content:"▍";color:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.err{color:var(--danger);font-size:13px;background:color-mix(in srgb,var(--danger) 8%,transparent);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);border-radius:10px;padding:9px 12px}

/* ── 입력창 ── */
footer{padding:4px max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
footer>*{max-width:800px;margin-inline:auto}

.trashbtn{display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--faint);font-size:12px;padding:6px 10px;cursor:pointer}
.trashbtn:hover{color:var(--fg)}
.trashbtn svg{width:14px;height:14px}
/* ── 폰 ── */
.only-m{display:none}
@media (max-width:860px){
  .only-m{display:grid}
  .side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);width:min(320px,86vw);box-shadow:var(--shadow)}
  .drawer-open .side{transform:none}
  .drawer-open .scrim{display:block;position:fixed;inset:0;z-index:15;background:var(--scrim)}
  header{padding-left:max(6px,env(safe-area-inset-left,0px));min-height:52px}
  .item .more{opacity:1}
  kbd{display:none}
}
@media (max-width:560px){
  main{gap:18px;padding-inline:14px}
  .hd-folder,.tok{display:none}
  .hero h2{font-size:21px}
  .bubble{max-width:88%}
  .composer{border-radius:18px;padding:6px 6px 4px}
  .cl .icon{width:34px;height:34px} .cl .icon svg{width:19px;height:19px}
  .mode{padding:0 9px;height:30px}
  .mode span{display:none}
  .mode.on span{display:inline}
  .examples{margin-top:12px}
  .mini-search input{width:110px}
  .row2{grid-template-columns:1fr}
}
@media (max-width:410px){
  .mode.on span{display:none}
  .cr{gap:6px}
  .cl{min-width:0;overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}.cursor .md>:last-child::after,.cursor .md:empty::after,.tool.run .tdot{animation:none}}
/* OpenClaw 모델 */
.ocbar{display:flex;padding:2px 6px 0}
.occhip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--pc) 45%,transparent);background:color-mix(in srgb,var(--pc) 10%,transparent);color:var(--pc);font:inherit;font-size:12.5px;cursor:pointer}
.occhip svg{width:14px;height:14px;flex:none} .occhip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .occhip i{font-style:normal;opacity:.7}
.occhip.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:color-mix(in srgb,var(--danger) 8%,transparent)}
.ocm{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.ocm-h{font-size:11.5px;color:var(--muted);margin:10px 2px 4px;letter-spacing:.02em}
.ocm-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:12px;border:1px solid transparent;background:none;color:var(--fg);font:inherit;cursor:pointer}
.ocm-row:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.ocm-row.on{border-color:color-mix(in srgb,var(--pc) 50%,transparent);background:color-mix(in srgb,var(--pc) 9%,transparent)}
.ocm-row:disabled{opacity:.6;cursor:default}
.ocm-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);flex:none}
.ocm-row.on .ocm-dot{border-color:var(--pc);background:radial-gradient(var(--pc) 45%,transparent 50%)}
.ocm-n{display:flex;flex-direction:column;min-width:0;flex:1} .ocm-n b{font-weight:600;font-size:14px} .ocm-n small{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocm-row em{font-style:normal;font-size:11px;color:var(--pc);flex:none}
.ocm .row-in{display:flex;gap:6px} .ocm .row-in .inp{flex:1;min-width:0}
.ocm .err-line{color:var(--danger);font-size:12.5px;margin:4px 2px}
.ocm-set{margin-top:8px}
.kbdrop{border-radius:14px;outline:2px dashed transparent;outline-offset:4px;transition:outline-color .15s}
.kbdrop.on{outline-color:var(--accent,#7b93ff);background:color-mix(in srgb,var(--accent,#7b93ff) 6%,transparent)}
.kbf-t{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:0}
.kbf-t svg{width:16px;height:16px;flex:none;opacity:.8} .kbf-t span{display:flex;flex-direction:column;min-width:0}
.mem.lib.sub{margin-left:22px}
/* 화면 테마 고르기 */
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:4px}
.seg button{flex:1;height:34px;border:0;border-radius:9px;background:none;color:var(--muted);font:500 13.5px var(--sans);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--panel);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--line2),0 1px 3px rgba(0,0,0,.1)}
.theme-hours{margin-top:2px}
/* DeepSeek 무검열/공식 고르기 (입력창 위) */
.dsprov{display:inline-flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px}
.dsprov button{height:26px;padding:0 12px;border:0;border-radius:999px;background:none;color:var(--muted);font:500 12.5px var(--sans);cursor:pointer}
.dsprov button:hover:not(:disabled){color:var(--fg)}
.dsprov button.on{background:color-mix(in srgb,var(--ds) 15%,var(--panel));color:var(--ds);font-weight:600}
.dsprov button:disabled{cursor:default}
.ocbar{align-items:center;gap:8px}
.dsmodel{font-size:12px;color:var(--muted)}
.chipsel{height:28px;max-width:170px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--fg);font:500 12.5px var(--sans);padding:0 8px;cursor:pointer;outline:none}
.chipsel:focus-visible{border-color:var(--accent)}
.chipsel:disabled{opacity:.6;cursor:default}
.mpick{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mpick select{flex:1;min-width:0}
.mpick small{flex-basis:100%;font-size:11.5px}
@media (max-width:560px){.ocbar{flex-wrap:wrap}.chipsel{max-width:46vw}}
/* Claude에게 보낼 때 뺀 내용 알림 */
.safenote{display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--warn) 7%,transparent);border:1px solid color-mix(in srgb,var(--warn) 28%,var(--line));border-radius:10px;padding:5px 10px}
.safenote svg{width:14px;height:14px;color:var(--warn);margin-top:2px;flex:none}
.safenote.lock{background:color-mix(in srgb,var(--ok) 7%,transparent);border-color:color-mix(in srgb,var(--ok) 28%,var(--line))}
.safenote.lock svg{color:var(--ok)}
.row-in{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row-in .inp{flex:1;min-width:160px}
/* 아이보리에서 색 점·그래프 테두리가 바탕에 묻히지 않게 */
[data-theme=light] .fdot,[data-theme=light] .legend i:not(.ln){box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
[data-theme=light] .g-node:not(.cur):not(.hit):not(.sel) circle{stroke:color-mix(in srgb,var(--c) 70%,#000)}
[data-theme=light] .md pre,[data-theme=light] .tool{border-color:var(--line2)}
</style>
