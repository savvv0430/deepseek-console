<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>DeepSeek Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
/* Layout: 왼쪽 대화 목록(폰은 서랍) | 오른쪽 채팅. 연결망·설정은 위에 겹치는 창 */
:root{
  --bg:#0e1117; --side:#12161e; --panel:#161a23; --raised:#1d2230; --line:#2a3142;
  --fg:#e6e9f0; --muted:#8a93a8; --accent:#5b7cff; --accent-ink:#fff;
  --danger:#ff6b6b; --ok:#4fd1a5;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);-webkit-text-size-adjust:100%;overflow:hidden}
#root{height:100%}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}

.shell{height:100%;display:flex}
.side{width:270px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px;
  padding:max(12px,env(safe-area-inset-top,0px)) 10px max(12px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin-top:6px}
.item{display:flex;align-items:center;border-radius:9px}
.item:hover,.item.on{background:var(--raised)}
.item-t{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--fg);padding:8px 10px;cursor:pointer;display:flex;flex-direction:column}
.item-t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.item-t small{color:var(--muted);font-size:11px}
.item .icon.sm{opacity:0;width:30px;height:30px}
.item:hover .icon.sm,.item.on .icon.sm{opacity:1}
.scrim{display:none}

.app{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);
  padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px 16px}
header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
header h1 span{color:var(--accent)}
.tag{font:500 10px var(--mono);color:var(--ok);border:1px solid var(--ok);border-radius:5px;padding:1px 5px;margin-left:8px;vertical-align:2px}
.hd-r{display:flex;align-items:center;gap:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:6px}
.dot.on{background:var(--ok)}

.btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 14px var(--sans);padding:9px 12px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn svg{width:18px;height:18px}
.btn.wide{width:100%}
.btn.ghostbtn{background:none}
.icon{flex:none;width:38px;height:38px;border-radius:10px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.icon:hover{color:var(--fg);background:var(--raised)}
.icon:disabled{opacity:.4}
.icon svg{width:21px;height:21px}
.icon.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}

main{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:18px;
  padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px))}
main>*{width:100%;max-width:820px;margin-inline:auto}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:420px;padding-inline:8px}
.empty b{display:block;color:var(--fg);font-size:18px;font-weight:600;margin-bottom:6px}
.msg{display:flex;flex-direction:column;gap:6px;min-width:0}
.msg.user{align-items:flex-end}
.bubble{max-width:85%;padding:10px 14px;border-radius:14px;border-bottom-right-radius:4px;background:var(--accent);color:var(--accent-ink);white-space:pre-wrap;overflow-wrap:anywhere}
.imgs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.imgs img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.status{font-size:12px;color:var(--muted)}
.sumnote{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:6px 10px;text-align:center}
.sources{margin:4px 0 0;padding-left:22px;font-size:13px;color:var(--muted)}
.sources a{color:var(--accent);word-break:break-all}
.md{overflow-wrap:anywhere;min-width:0}
.md p{margin:.5em 0}.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md pre{background:#0a0d13;border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font:13px/1.5 var(--mono)}
.md code{font-family:var(--mono);font-size:.9em}
.md :not(pre)>code{background:var(--raised);padding:1px 5px;border-radius:5px}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:5px 9px}
.md a{color:var(--accent)}
.md img{max-width:100%}
.md blockquote{margin:.5em 0;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
details.think{border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--muted);font-size:13px}
details.think summary{cursor:pointer}
details.think div{white-space:pre-wrap;margin-top:6px;max-height:40vh;overflow:auto}
.cursor .md>:last-child::after,.cursor .md:empty::after{content:"▍";color:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor .md>:last-child::after,.cursor .md:empty::after{animation:none}}
.err{color:var(--danger);font-size:13px;border:1px solid var(--danger);border-radius:10px;padding:8px 12px}

footer{border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
footer>*{max-width:820px;margin-inline:auto}
.attach{display:flex;gap:8px;overflow-x:auto;padding:6px 0 8px}
.thumb{position:relative;flex:none}
.thumb img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.thumb button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--raised);color:var(--fg);font-size:13px;line-height:1;cursor:pointer;padding:0}
.composer{display:flex;gap:2px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px}
.composer:focus-within{border-color:var(--accent)}
.composer.drag{border-color:var(--accent);border-style:dashed}
.composer textarea{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:16px/1.5 var(--sans);resize:none;outline:none;max-height:180px;padding:7px 6px}
.send{flex:none;border:0;background:var(--accent);color:var(--accent-ink);font:600 14px var(--sans);height:38px;padding:0 16px;border-radius:10px;cursor:pointer}
.send:disabled{opacity:.4;cursor:default}
.send.stop{background:var(--raised);color:var(--fg)}

.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.ov-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:8px}
.ov-head .muted{font-size:13px}
.graph{flex:1;width:100%;min-height:0;touch-action:none}
.g-links line{stroke:var(--line)}
.g-node circle{fill:var(--raised);stroke:var(--accent);stroke-width:1.5}
.g-node:hover circle{fill:color-mix(in srgb,var(--accent) 35%,var(--raised))}
.g-node.cur circle{fill:var(--accent)}
.g-node text{text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.g-node .t1{fill:var(--fg);font-size:12px}
.g-node .t2{fill:var(--muted);font-size:10px;font-family:var(--mono)}

.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.sheet{width:100%;max-width:440px;max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.lbl{font-size:12px;color:var(--muted);margin-top:8px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:16px var(--mono);padding:9px 10px;outline:none;resize:vertical}
textarea.inp{font-family:var(--sans)}
.inp:focus{border-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:4px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.help{margin:2px 0 0;font-size:12px;color:var(--muted)}
.help a{color:var(--accent)}
.help b{color:var(--fg);font-weight:500}
.help.warn{color:#f5b971}
.sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;font-weight:600}
.syncrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.syncrow .small{flex:1;min-width:0}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.sm svg{width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:default}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.sdot.ok{background:var(--ok)} .sdot.busy{background:var(--accent)} .sdot.err{background:var(--danger)}
.syncbar{display:flex;align-items:center;gap:8px;background:none;border:0;border-top:1px solid var(--line);color:var(--muted);font:12px var(--sans);padding:10px 6px 0;cursor:pointer;text-align:left}
.syncbar:hover{color:var(--fg)}
.ws{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.ws-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.ws-h svg{width:16px;height:16px;color:var(--accent)}
.ws-info{display:flex;flex-direction:column;min-width:0;background:var(--raised);border-radius:9px;padding:7px 10px}
.ws-info b{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-info small{color:var(--muted);font-size:11px}
.ws-status{color:var(--accent);margin:0}
.ws-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ws-btns .btn{flex:1;justify-content:center}
.ws-btns .icon.sm{width:32px;height:32px}
.ws .help{margin:0}
.wschip{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:none;color:var(--muted);font:12px var(--mono);border-radius:999px;padding:3px 9px;cursor:pointer;margin-right:6px}
.wschip svg{width:14px;height:14px;color:var(--accent)}
.app.dragging main{outline:2px dashed var(--accent);outline-offset:-10px;border-radius:14px}
.tool{border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13px;overflow:hidden}
.tool details>summary{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;list-style:none;min-width:0}
.tool details>summary::-webkit-details-marker{display:none}
.tool summary b{font-weight:600;white-space:nowrap}
.tool summary code{font:12px var(--mono);color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .tstat{font-size:12px;color:var(--muted);white-space:nowrap}
.tool.err .tstat{color:var(--danger)}
.tdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)}
.tool.run .tdot{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.tool.err .tdot{background:var(--danger)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.tool.run .tdot{animation:none}}
.tres,.diff{margin:0;border-top:1px solid var(--line);padding:9px 10px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;color:var(--fg);background:var(--bg)}
.diff .add{color:var(--ok)} .diff .del{color:var(--danger)} .diff .hd{color:var(--muted)}
.timgs{display:flex;flex-wrap:wrap;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.timgs img{max-width:100%;max-height:420px;border-radius:8px;background:#fff}
.tact{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.pcline{display:flex;align-items:center;gap:6px}
.pcline svg{width:14px;height:14px;color:var(--accent)}
.icon.pcon{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.approvals{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.appr{border:1px solid #f5b971;background:color-mix(in srgb,#f5b971 10%,var(--panel));border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.appr-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.appr-t b{font-size:13px;font-weight:600}
.appr-t code{font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:120px;overflow:auto;background:var(--bg);border-radius:8px;padding:6px 8px}
.appr-btns{display:flex;flex-wrap:wrap;gap:6px}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--line))}
.sdot.off{background:var(--line)}
@media (max-width:520px){.composer .icon{width:34px;height:34px}.composer .icon svg{width:19px;height:19px}.send{padding:0 12px}}
.qr{display:block;width:min(280px,100%);height:auto;margin:6px auto;border-radius:12px;image-rendering:pixelated;background:#fff}

.only-m{display:none}
@media (max-width:860px){
  .only-m{display:grid}
  .side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s ease;width:min(300px,85vw)}
  .drawer-open .side{transform:none}
  .drawer-open .scrim{display:block;position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.5)}
  header{padding-left:max(8px,env(safe-area-inset-left,0px))}
  .tag{display:none}
  .item .icon.sm{opacity:1}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
