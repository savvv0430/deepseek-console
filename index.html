<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>DeepSeek Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
/* Layout: 상단 키 바 → 스크롤 대화 → 하단 입력창(사진 첨부). 폰은 한 화면 앱처럼 */
:root{
  --bg:#0e1117; --panel:#161a23; --raised:#1d2230; --line:#2a3142;
  --fg:#e6e9f0; --muted:#8a93a8; --accent:#5b7cff; --accent-ink:#fff;
  --danger:#ff6b6b; --ok:#4fd1a5;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);-webkit-text-size-adjust:100%}
#root{height:100%}
.app{height:100%;display:flex;flex-direction:column;max-width:860px;margin:0 auto;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
header{padding-block:max(12px,env(safe-area-inset-top,0px)) 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand h1 span{color:var(--accent)}
.tag{font:500 10px var(--mono);color:var(--ok);border:1px solid var(--ok);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 10px;flex:1 1 260px;min-width:0}
.field:focus-within{border-color:var(--accent)}
.field input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:16px var(--mono);padding:9px 0;outline:none}
.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--ok)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 13px var(--sans);padding:7px 12px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.ghost{background:none;border:0;color:var(--muted);cursor:pointer;font:13px var(--sans);padding:6px}
.ghost:hover{color:var(--fg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea.sys{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:16px/1.5 var(--sans);padding:10px;resize:vertical;min-height:60px;outline:none}
textarea.sys:focus{border-color:var(--accent)}
main{flex:1;overflow-y:auto;padding-block:18px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:420px;padding-inline:8px}
.empty b{display:block;color:var(--fg);font-size:18px;font-weight:600;margin-bottom:6px}
.msg{display:flex;flex-direction:column;gap:4px;min-width:0}
.msg.user{align-items:flex-end}
.bubble{max-width:85%;min-width:0;padding:10px 14px;border-radius:14px;overflow-wrap:anywhere}
.user .bubble{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;white-space:pre-wrap}
.assistant .bubble{max-width:100%;background:none;padding:0 2px}
.who{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.imgs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.imgs img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.md p{margin:.5em 0}.md :first-child{margin-top:0}.md :last-child{margin-bottom:0}
.md pre{background:#0a0d13;border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font:13px/1.5 var(--mono)}
.md code{font-family:var(--mono);font-size:.9em}
.md :not(pre)>code{background:var(--raised);padding:1px 5px;border-radius:5px}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:5px 9px}
.md a{color:var(--accent)}
.md img{max-width:100%}
.md blockquote{margin:.5em 0;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
details.think{border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:8px;color:var(--muted);font-size:13px}
details.think summary{cursor:pointer}
details.think div{white-space:pre-wrap;margin-top:6px}
.cursor::after{content:"▍";color:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor::after{animation:none}}
.err{color:var(--danger);font-size:13px;border:1px solid var(--danger);border-radius:10px;padding:8px 12px}
footer{padding-block:8px max(12px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.attach{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.thumb{position:relative;flex:none}
.thumb img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.thumb button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--raised);color:var(--fg);font-size:13px;line-height:1;cursor:pointer;padding:0}
.composer{display:flex;gap:6px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px}
.composer:focus-within{border-color:var(--accent)}
.composer.drag{border-color:var(--accent);border-style:dashed}
.composer textarea{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:16px/1.5 var(--sans);resize:none;outline:none;max-height:180px;padding:7px 4px}
.icon{flex:none;width:38px;height:38px;border-radius:10px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.icon:hover{color:var(--fg);background:var(--raised)}
.icon svg{width:22px;height:22px}
.send{flex:none;border:0;background:var(--accent);color:var(--accent-ink);font:600 14px var(--sans);height:38px;padding:0 16px;border-radius:10px;cursor:pointer}
.send:disabled{opacity:.4;cursor:default}
.send.stop{background:var(--raised);color:var(--fg)}
.hint{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}
@media (max-width:520px){
  .brand .ghost.sysbtn{display:none}
  .hint{display:none}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

const API_URL = "https://nokeep.ai/v1/chat/completions";
const MODEL   = "deepseek-v4.1-flash-uncensored";
const MAX_IMAGES = 10;

function Markdown({ text }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    ref.current.innerHTML = DOMPurify.sanitize(marked.parse(text || ""));
    ref.current.querySelectorAll("pre code").forEach(el => { try { hljs.highlightElement(el); } catch {} });
  }, [text]);
  return <div className="md" ref={ref} />;
}

// 사진을 최대 1600px JPEG로 줄여 data URL로 변환 (토큰·전송량 절약)
function fileToDataURL(file, max = 1600) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이미지를 읽을 수 없습니다.")); };
    img.src = url;
  });
}

const ImageIcon = () => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>
  </svg>
);

function App() {
  // API 키는 React state에만 존재 — 저장소/쿠키/URL에 남기지 않음
  const [apiKey, setApiKey] = useState("");
  const [showKey, setShowKey] = useState(false);
  const [system, setSystem] = useState("");
  const [showSys, setShowSys] = useState(false);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [images, setImages] = useState([]);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [drag, setDrag] = useState(false);
  const abortRef = useRef(null);
  const endRef = useRef(null);
  const taRef = useRef(null);
  const fileRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({ block: "end" }); }, [messages, error]);

  const autosize = () => {
    const t = taRef.current; if (!t) return;
    t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 180) + "px";
  };

  async function addFiles(files) {
    const list = Array.from(files || []).filter(f => f.type.startsWith("image/"));
    if (!list.length) return;
    const room = MAX_IMAGES - images.length;
    if (room <= 0) { setError(`사진은 한 번에 ${MAX_IMAGES}장까지 보낼 수 있습니다.`); return; }
    try {
      const urls = await Promise.all(list.slice(0, room).map(f => fileToDataURL(f)));
      setImages(prev => [...prev, ...urls]);
      if (list.length > room) setError(`사진은 ${MAX_IMAGES}장까지만 추가했습니다.`);
    } catch (e) { setError(e.message); }
  }

  const toApi = (m) => {
    if (m.role === "user" && m.images?.length) {
      return { role: "user", content: [
        ...(m.content ? [{ type: "text", text: m.content }] : []),
        ...m.images.map(u => ({ type: "image_url", image_url: { url: u } })),
      ]};
    }
    return { role: m.role, content: m.content };
  };

  async function send() {
    const text = input.trim();
    if ((!text && !images.length) || busy) return;
    if (!apiKey.trim()) { setError("먼저 위에 nokeep API 키를 입력하세요."); return; }
    setError("");
    const history = [...messages, { role: "user", content: text, images }];
    setMessages([...history, { role: "assistant", content: "", reasoning: "", streaming: true }]);
    setInput(""); setImages([]); setTimeout(autosize, 0);
    setBusy(true);

    const ctrl = new AbortController(); abortRef.current = ctrl;
    const payload = [
      ...(system.trim() ? [{ role: "system", content: system.trim() }] : []),
      ...history.map(toApi),
    ];

    let content = "", reasoning = "";
    const update = (done) => setMessages(ms => {
      const copy = ms.slice();
      copy[copy.length - 1] = { role: "assistant", content, reasoning, streaming: !done };
      return copy;
    });

    try {
      const res = await fetch(API_URL, {
        method: "POST", signal: ctrl.signal,
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey.trim() },
        body: JSON.stringify({ model: MODEL, messages: payload, stream: true }),
      });
      if (!res.ok) {
        let msg = `요청 실패 (${res.status})`;
        try { const j = await res.json(); const m = j?.error?.message || j?.message; if (m) msg += ": " + m; } catch {}
        if (res.status === 401) msg = "API 키가 올바르지 않습니다. 키를 확인하세요.";
        if (res.status === 402) msg = "nokeep 잔액이 부족합니다. 콘솔에서 충전하세요.";
        throw new Error(msg);
      }
      const ctype = res.headers.get("content-type") || "";
      if (!ctype.includes("event-stream")) {
        // 스트리밍을 지원하지 않는 경우 한 번에 받기
        const j = await res.json();
        const m = j.choices?.[0]?.message || {};
        content = m.content || ""; reasoning = m.reasoning_content || "";
        update(true);
      } else {
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split("\n"); buf = lines.pop();
          for (const line of lines) {
            const l = line.trim();
            if (!l.startsWith("data:")) continue;
            const data = l.slice(5).trim();
            if (data === "[DONE]") continue;
            try {
              const d = JSON.parse(data).choices?.[0]?.delta || {};
              if (d.reasoning_content) reasoning += d.reasoning_content;
              if (d.content) content += d.content;
            } catch {}
          }
          update(false);
        }
        update(true);
      }
    } catch (e) {
      if (e.name === "AbortError") { update(true); }
      else {
        setMessages(ms => (content || reasoning) ? ms.map((m, i) => i === ms.length - 1 ? { ...m, streaming: false } : m) : ms.slice(0, -1));
        setError(e.message === "Failed to fetch" || e.message === "Load failed"
          ? "서버에 연결하지 못했습니다. 인터넷 연결을 확인하거나, 브라우저가 요청을 차단했는지 확인하세요."
          : e.message);
      }
    } finally { setBusy(false); abortRef.current = null; }
  }

  const stop = () => abortRef.current?.abort();
  const reset = () => { stop(); setMessages([]); setImages([]); setError(""); };

  return (
    <div className="app">
      <header>
        <div className="brand">
          <h1>Deep<span>Seek</span> Console<span className="tag">V4.1 FLASH · UNCENSORED</span></h1>
          <div className="row">
            <button className="ghost sysbtn" onClick={() => setShowSys(s => !s)}>{showSys ? "프롬프트 닫기" : "시스템 프롬프트"}</button>
            <button className="btn" onClick={reset} disabled={!messages.length && !error && !images.length}>새 대화</button>
          </div>
        </div>
        <div className="row">
          <label className="field" htmlFor="key">
            <span className={"dot" + (apiKey.trim() ? " on" : "")} />
            <span className="label">API Key</span>
            <input id="key" type={showKey ? "text" : "password"} placeholder="nokeep 키 붙여넣기" value={apiKey}
              onChange={e => setApiKey(e.target.value)} autoComplete="off" autoCapitalize="off" spellCheck={false} />
            <button className="ghost" onClick={(e) => { e.preventDefault(); setShowKey(s => !s); }}>{showKey ? "숨기기" : "보기"}</button>
          </label>
        </div>
        {showSys && (
          <textarea id="sys" className="sys" placeholder="예: 너는 친절한 한국어 튜터야. 답은 짧게."
            value={system} onChange={e => setSystem(e.target.value)} />
        )}
      </header>

      <main>
        {!messages.length && !error && (
          <div className="empty">
            <b>무엇이든 물어보세요</b>
            키를 넣고 메시지를 보내면 실시간으로 답이 표시됩니다. 사진은 왼쪽 아래 사진 버튼, 붙여넣기, 끌어다 놓기로 첨부할 수 있어요.
            키는 이 탭에만 있고 새로고침하면 사라집니다.
          </div>
        )}
        {messages.map((m, i) => (
          <div key={i} className={"msg " + m.role}>
            <span className="who">{m.role === "user" ? "나" : "DeepSeek"}</span>
            {m.role === "user" && m.images?.length > 0 && (
              <div className="imgs">{m.images.map((u, j) => <img key={j} src={u} alt={`첨부 사진 ${j + 1}`} />)}</div>
            )}
            {(m.role !== "user" || m.content) && (
              <div className="bubble">
                {m.role === "user" ? m.content : (
                  <>
                    {m.reasoning && (
                      <details className="think" open={m.streaming && !m.content}>
                        <summary>생각 과정</summary><div>{m.reasoning}</div>
                      </details>
                    )}
                    <div className={m.streaming ? "cursor" : ""}><Markdown text={m.content} /></div>
                  </>
                )}
              </div>
            )}
          </div>
        ))}
        {error && <div className="err">{error}</div>}
        <div ref={endRef} />
      </main>

      <footer>
        {images.length > 0 && (
          <div className="attach">
            {images.map((u, i) => (
              <div className="thumb" key={i}>
                <img src={u} alt={`첨부 예정 사진 ${i + 1}`} />
                <button aria-label="사진 빼기" onClick={() => setImages(im => im.filter((_, j) => j !== i))}>×</button>
              </div>
            ))}
          </div>
        )}
        <div className={"composer" + (drag ? " drag" : "")}
          onDragOver={e => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
          onDrop={e => { e.preventDefault(); setDrag(false); addFiles(e.dataTransfer.files); }}>
          <button className="icon" aria-label="사진 첨부" onClick={() => fileRef.current?.click()} disabled={busy}><ImageIcon /></button>
          <input ref={fileRef} id="file" type="file" accept="image/*" multiple hidden
            onChange={e => { addFiles(e.target.files); e.target.value = ""; }} />
          <textarea id="prompt" ref={taRef} rows={1} placeholder="메시지 입력"
            value={input} onChange={e => { setInput(e.target.value); autosize(); }}
            onPaste={e => { const f = Array.from(e.clipboardData?.files || []); if (f.length) { e.preventDefault(); addFiles(f); } }}
            onKeyDown={e => {
              const touch = window.matchMedia("(pointer: coarse)").matches;
              if (e.key === "Enter" && !e.shiftKey && !touch && !e.nativeEvent.isComposing) { e.preventDefault(); send(); }
            }} />
          {busy
            ? <button className="send stop" onClick={stop}>중지</button>
            : <button className="send" onClick={send} disabled={!input.trim() && !images.length}>전송</button>}
        </div>
        <div className="hint">Enter 전송 · Shift+Enter 줄바꿈 · 요청은 브라우저에서 nokeep.ai로 직접 전송됩니다</div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
